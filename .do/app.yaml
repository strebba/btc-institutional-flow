# ─────────────────────────────────────────────────────────────────────────────
# DO App Platform spec — btc-institutional-flow
#
# Container unico con 3 processi (supervisord):
#   nginx :8080  → reverse proxy pubblico
#   uvicorn :8000 → FastAPI backend (solo loopback)
#   streamlit :8501 → dashboard Streamlit (solo loopback)
#
# Routing (gestito da nginx nel container):
#   /api/* → FastAPI   |   /* → Streamlit dashboard
#
# I dati sono condivisi via DB versionato nel repo (App Platform non supporta
# volumi): il workflow EDGAR committa data/structured_notes.db su main →
# redeploy automatico di entrambi i servizi con dati freschi.
#
# Applicare: DO Console → Settings → App Spec → Edit → incolla questo file
# ─────────────────────────────────────────────────────────────────────────────
name: btc-institutional-flow
region: fra
features:
  - buildpack-stack=ubuntu-22
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: supervisord -c /app/supervisord.conf
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    github:
      repo: strebba/btc-institutional-flow
      branch: main
      deploy_on_push: true
    health_check:
      http_path: /api/health
      initial_delay_seconds: 60
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 10
    envs:
      - key: CORS_ORIGINS
        value: "https://btc-institutional-flow-tpw9m.ondigitalocean.app,https://www.wagmi-lab.com,http://localhost:3000,http://localhost:8501"
        scope: RUN_TIME
        type: GENERAL
      - key: EDGAR_USER_AGENT
        value: "ibit-gamma-tracker/1.0 (strebba90@gmail.com)"
        scope: RUN_TIME
        type: GENERAL
      - key: DB_PATH
        value: "data/structured_notes.db"
        scope: RUN_TIME
        type: GENERAL
