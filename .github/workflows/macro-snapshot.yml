name: Macro snapshot (giornaliero)

# Fotografa funding rate e open interest dei perpetui BTC da CoinGecko e committa
# il DB aggiornato su main.
#
# Serve a far maturare la finestra a 7 giorni della variazione di open interest:
# CoinGecko dà il livello istantaneo, non la serie, e il filesystem di DO App
# Platform è effimero — quindi lo storico deve stare nel DB versionato, esattamente
# come le note SEC di edgar-refresh.yml.
#
# La chiave CoinGecko è facoltativa: l'endpoint /derivatives risponde anche senza.

on:
  schedule:
    - cron: "10 6 * * *"   # ogni giorno 06:10 UTC, prima del refresh EDGAR
  workflow_dispatch:

permissions:
  contents: write           # per committare il DB aggiornato

concurrency:
  group: db-write           # non deve sovrapporsi a edgar-refresh: stesso file .db
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro snapshot
        env:
          PYTHONPATH: .
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/cron_macro.py

      - name: Commit DB if changed
        run: |
          if [[ -n "$(git status --porcelain data/structured_notes.db)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/structured_notes.db
            # rebase prima del push: edgar-refresh committa lo stesso file
            git commit -m "chore(macro): snapshot giornaliero funding/OI"
            git pull --rebase origin main
            git push
          else
            echo "Nessuna modifica al DB — niente da committare."
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets non configurati — skip notifica"
            exit 0
          fi
          python3 scripts/notify_telegram.py "⚠️ <b>Macro snapshot FALLITO</b>
          Run: <a href='${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>${GITHUB_RUN_ID}</a>
          Data: $(date -u +'%Y-%m-%d %H:%M UTC')
          La finestra a 7 giorni dell'open interest non avanza."
