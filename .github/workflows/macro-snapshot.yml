name: Macro snapshot (giornaliero)

# Fotografa funding rate e open interest dei perpetui BTC/ETH da CoinGecko e li
# scrive nel Postgres di produzione (secret DATABASE_URL).
#
# Serve a far maturare la finestra a 7 giorni della variazione di open interest:
# CoinGecko dà il livello istantaneo, non la serie. Prima lo storico viveva nel
# DB SQLite versionato e il workflow lo committava su main (un commit e un deploy
# DO al giorno); ora vive in Postgres e il repo non viene più toccato.
#
# La chiave CoinGecko è facoltativa: l'endpoint /derivatives risponde anche senza.

on:
  schedule:
    - cron: "10 6 * * *"   # ogni giorno 06:10 UTC, prima del refresh EDGAR
  workflow_dispatch:

permissions:
  contents: read            # niente più commit del DB: si scrive su Postgres

concurrency:
  group: db-write           # serializza i job che scrivono sul DB di produzione
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # mai da branch di feature: scrive sul DB di produzione
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require DATABASE_URL (Postgres di produzione)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Secret DATABASE_URL non configurato: il job scrive solo su Postgres (vedi docs/cutover-postgres.md)."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macro snapshot
        env:
          PYTHONPATH: .
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/cron_macro.py

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets non configurati — skip notifica"
            exit 0
          fi
          python3 scripts/notify_telegram.py "⚠️ <b>Macro snapshot FALLITO</b>
          Run: <a href='${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>${GITHUB_RUN_ID}</a>
          Data: $(date -u +'%Y-%m-%d %H:%M UTC')
          La finestra a 7 giorni dell'open interest non avanza."
