name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pin esatto: le versioni recenti di ruff abilitano di default regole
      # (UP045/BLE001/DTZ) mai applicate a questo repo. Il formato non e'
      # ancora ruff-format (137 file da riformattare): il check e' disattivato
      # finche' non si adotta il formato in un commit dedicato.
      - run: pip install "ruff==0.15.16"
      - run: ruff check src/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest --tb=short -q --cov=src --cov-report=xml

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets non configurati — skip notifica"
            exit 0
          fi
          python3 scripts/notify_telegram.py "⚠️ <b>CI FALLITO</b>
          Run: <a href='${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'>${GITHUB_RUN_ID}</a>
          Data: $(date -u +'%Y-%m-%d %H:%M UTC')
          Branch: ${GITHUB_REF_NAME}"

  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    # Stessa suite contro un Postgres usa-e-getta (service container, mai
    # produzione): verifica che il backend DATABASE_URL resti compatibile.
    # I test sqlite_only vengono saltati.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests on Postgres
        env:
          PYTHONPATH: .
          BIF_TEST_BACKEND: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pytest --tb=short -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    # Solo un build, senza push: intercetta un Dockerfile rotto (path COPY,
    # dipendenza mancante nello stage runtime) prima che arrivi al deploy DO,
    # che builda dallo stesso Dockerfile su push a main.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t btc-institutional-flow:ci .
