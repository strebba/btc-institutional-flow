# ─────────────────────────────────────────────────────────────────────────────
# supervisord.conf — process manager per il container DO App Platform
#
#   nginx      :8080  — reverse proxy pubblico (root, può aprire la porta)
#   uvicorn    :8000  — FastAPI backend (appuser, solo loopback)
#   streamlit  :8501  — dashboard Streamlit (appuser, solo loopback)
#
# Tutti i log vanno su stdout/stderr → catturati da App Platform.
# ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

# ── nginx: reverse proxy pubblico ─────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startretries=10
startsecs=1
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── FastAPI backend ───────────────────────────────────────────────────────────
[program:uvicorn]
command=/usr/local/bin/python /app/run_api.py --host 127.0.0.1 --port 8000
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOST="127.0.0.1",PORT="8000",HOME="/tmp"

# ── Dashboard Streamlit ───────────────────────────────────────────────────────
[program:streamlit]
command=/usr/local/bin/streamlit run src/dashboard/app.py --server.port 8501 --server.address 127.0.0.1 --server.headless true --browser.gatherUsageStats false
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=10
startsecs=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/tmp"
