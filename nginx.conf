# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — reverse proxy per btc-institutional-flow (DO App Platform)
#
# Routing:
#   /api/*      → FastAPI (uvicorn :8000)   [REST]
#   /_stcore/*  → Streamlit (:8501)         [WebSocket + static]
#   /*          → Streamlit (:8501)         [dashboard]
#
# Per l'embedding in iframe su Wix (wagmi-lab.com):
#   - strip X-Frame-Options: DENY impostato hardcoded da Streamlit
#   - Content-Security-Policy frame-ancestors limita il framing a wagmi-lab.com
# ─────────────────────────────────────────────────────────────────────────────

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    # Temp paths scrivibili dall'utente non-root del container
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    upstream api {
        server 127.0.0.1:8000;
    }

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    server {
        listen 8080;
        server_name _;

        # ── FastAPI REST ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Streamlit — WebSocket core (sessioni, rerun, widgets) ─────────
        location /_stcore/ {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Streamlit forza X-Frame-Options: DENY → lo rimuoviamo per iframe
            proxy_hide_header X-Frame-Options;
        }

        # ── Streamlit — app, static, media ────────────────────────────────
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # iframe embedding: rimuovi X-Frame-Options di Streamlit e
            # autorizza esplicitamente solo il dominio Wix
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors https://www.wagmi-lab.com https://wagmi-lab.com;";
        }
    }
}
